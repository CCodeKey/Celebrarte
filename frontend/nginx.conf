server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Upload de imagem: até 5 MB pelo backend, mais a mensagem
    client_max_body_size 6m;

    # Mesmo papel do proxy do Vite em dev: /api/x vai para http://backend:8080/x
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome: podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rotas do React Router (/c/..., /m/..., /celebracoes...) caem no index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
